services:
  - type: web
    name: mlprocessguard
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r app/backend/requirements.txt
    startCommand: cd app/backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MLPG_DEMO_HOURS
        value: "12"
    autoDeploy: true
